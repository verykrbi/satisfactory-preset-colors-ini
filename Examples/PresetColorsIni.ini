; Preset Colors INI - extra entries for the color picker presets.
; Read when a world starts. Reload your save after editing.
;
; Copy this file to %LOCALAPPDATA%\FactoryGame\Saved\PresetColorsIni.ini
;
; Format, one color per line, under [Colors]:
;   Name=#RRGGBB         hex, as shown in the color picker
;   Name=R,G,B           each 0-255
;   Name=hsv(H,S,V)      hue 0-360, saturation 0-1, value 0 or more; above 1 is brighter than white
;   Name=linear(R,G,B)   the game's own linear float values (1 = white), no conversion; a 4th value is alpha
; Lines starting with ; or # are comments.
;
; This example is a palette of linear values, as written by the export
; (PresetColorsIni.Exported.ini). The colors are listed at the top of the picker in the order of this file.

